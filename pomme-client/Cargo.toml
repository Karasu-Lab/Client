[package]
name = "pomme-client"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = ["game", "vulkan", "singleplayer"]
# The playable client: connections, accounts, sound, the window app and the
# menus. Off, only the world renderer, mesher and the data they need are built
# (the viewer), which is what compiles for the web: azalea-protocol and the
# networking under it do not build for wasm.
game = [
    "dep:tokio",
    "dep:reqwest",
    "dep:rsa",
    "dep:sha1",
    "dep:sha1_smol",
    "dep:tracing-appender",
    "dep:mimalloc",
    "dep:libmimalloc-sys",
    "dep:azalea-protocol",
    "dep:azalea-crypto",
    "dep:azalea-auth",
    "dep:libloading",
    "dep:open",
    "dep:symphonia",
    "dep:arboard",
    "dep:pomme-auth",
    "dep:clap",
]
# Draws through Vulkan (`renderer::rhi::vulkan`).
vulkan = ["dep:pyronyx", "dep:pomme-gpu-allocator"]
# Draws through wgpu (`wgpu`), WebGPU in the browser. Takes the WGSL build.rs
# writes, as the wgpu backend cannot load SPIR-V.
wgpu = ["wgpu/backend", "wgsl-shaders"]
# Takes the WGSL build.rs writes beside the SPIR-V, for backends that cannot
# load SPIR-V (the wgpu backend, on the web).
wgsl-shaders = []
# Discord rich presence. Not part of any build unless asked for.
discord = ["game", "dep:discord-rich-presence"]
# Embeds SteelMC as the integrated server. Off, the world screens still list and
# edit saves but nothing can open one.
singleplayer = ["game", "dep:pomme-singleplayer"]
# Loads `ttf` font providers from resource packs through the system FreeType
# (pkg-config). Off, those providers are skipped.
ttf-fonts = ["dep:freetype-rs"]
# Headless CPU benchmarks (`just bench`): `--cpu-bench [filter]` runs criterion
# over the mesher, fade rebuild and occlusion walk, then exits.
cpu-bench = ["dep:criterion"]
# Debug test harness (`just ingame-test`, tests/ingame/README.md): drives the client
# from scripts or a localhost socket. Never enabled in release builds.
test-harness = ["dep:toml"]

[[bin]]
name = "pomme-client"
path = "src/main.rs"
required-features = ["game"]

[build-dependencies]
flate2 = "1"
shaderc = "0.10"
# SPIR-V to WGSL for the wgpu backend, which cannot take SPIR-V on the web.
naga = { version = "30.0.1", features = ["spv-in", "wgsl-out"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha1_smol = { workspace = true, optional = true }
base64 = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
rsa = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true }
regex = { workspace = true }
zip = { workspace = true }
tokio = { workspace = true, features = ["full", "tracing"], optional = true }
reqwest = { workspace = true, features = ["blocking"], optional = true }
pyronyx = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

tracing-appender = { version = "0.2", optional = true }
# Shader packs: GLSL parsed and rewritten in Rust, then compiled to SPIR-V.
# naga 30's `glsl-in` doesn't build without `wgsl-in`.
glsl-lang = { version = "0.8.1", features = ["lexer-full"] }
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in", "spv-out"] }
# Per-thread-heap allocator: the chunk-mesh worker pool churns vertex/index Vecs
# across threads, and the default system heap's global lock serializes that and
# stalls the main thread. Mirrors vanilla (JVM TLABs + LWJGL's jemalloc).
mimalloc = { version = "0.1", optional = true }
# `mi_option_set`, to return freed memory sooner (lib.rs).
libmimalloc-sys = { version = "0.1", features = ["extended"], optional = true }
pomme-gpu-allocator = { path = "../pomme-gpu-allocator", optional = true }
# The RHI's descriptions, shared by both backends, and the wgpu backend behind
# the `wgpu` feature. A path into BlockWorldRenderer, which carries this Client
# as a submodule.
wgpu = { path = "../../../crates/wgpu", default-features = false }
pomme-dirs = { path = "../pomme-dirs" }
pomme-protocol = { path = "../pomme-protocol" }
pomme-install = { path = "../pomme-install" }
pomme-vfs = { path = "../pomme-vfs" }
# The engine's thin interfaces, which the client implements: worker threads,
# the UI switch, the F3 screen, the settings and the layered resource packs.
thread = { path = "../../../crates/thread" }
ui = { path = "../../../crates/ui" }
debugger = { path = "../../../crates/debugger" }
settings = { path = "../../../crates/settings" }
resourcepack = { path = "../../../crates/resourcepack" }
utils = { path = "../../../crates/utils" }
pomme-singleplayer = { path = "../pomme-singleplayer", optional = true }
winit = { version = "0.30", features = ["rwh_06"] }
raw-window-handle = "0.6"
glam = { workspace = true }
clap = { version = "4", features = ["derive"], optional = true }
parking_lot = "0.13"
bytemuck = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
flate2 = "1"
azalea-buf = "0.16"
# `connecting` and `online-mode` only gate azalea's own connection type, which
# pomme replaced with net::conn; authentication goes straight to azalea-auth.
azalea-protocol = { version = "0.16", default-features = false, optional = true }
azalea-crypto = { version = "0.16", optional = true }
azalea-auth = { version = "0.16", optional = true }
azalea-entity = "0.16"
azalea-block = "0.16"
azalea-chat = "0.16"
# azalea-core uses bevy_ecs without gating it on its feature; azalea-world
# used to turn both of these on.
azalea-core = { version = "0.16", features = ["bevy_ecs", "serde"] }
azalea-registry = "0.16"
azalea-inventory = "0.16"
uuid = { version = "1", features = ["v4", "rng-getrandom"] }
md-5 = "0.11"
crossbeam-channel = "0.5"
png = "0.17"
toml = { version = "1", optional = true }
image = "0.25"
fontdue = "0.9.3"
freetype-rs = { version = "0.38", optional = true }
simdnbt = "0.10"
scopeguard = "1.2"
libloading = { version = "0.9", optional = true }
open = { workspace = true, optional = true }
discord-rich-presence = { version = "1.1", optional = true }
criterion = { version = "=0.8.2", default-features = false, optional = true }
symphonia = { version = "0.5.5", default-features = false, features = ["ogg", "vorbis"], optional = true }
fastrand = "2"
gilrs = "0.11.2"

# The browser has no OS randomness, clock or threads of its own: randomness
# and time come from JavaScript.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom-03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom-04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
web-time = "1"

# arboard has no Android or iOS backend; pyronyx's window-handle helpers don't
# compile for Android and have no iOS arm (see
# `renderer::rhi::vulkan::context::window_surface`).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
pyronyx = { workspace = true, features = ["rwh_06"], optional = true }
arboard = { version = "3", features = ["wayland-data-control"], optional = true }

# Android has no OS credential store for pomme-auth (see `account::store`).
[target.'cfg(not(target_os = "android"))'.dependencies]
pomme-auth = { path = "../pomme-auth", features = ["keyring"], optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
raw-window-metal = "1.1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
pomme-auth = { path = "../pomme-auth", optional = true }
jni = "0.22"
winit = { version = "0.30", features = ["android-native-activity"] }
paranoid-android = "0.2"

[dev-dependencies]
pomme-protocol = { path = "../pomme-protocol", features = ["vanilla-fixtures"] }
