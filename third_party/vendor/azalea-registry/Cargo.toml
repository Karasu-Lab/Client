[package]
name = "azalea-registry"
description = "Use Minecraft's registries."
version = "0.16.0+mc26.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/azalea-rs/azalea"

[dependencies]
azalea-buf = { git = "https://github.com/azalea-rs/azalea", rev = "ffedf17c9b6ff9fbafbf7e0d14c8d2366b2d0a32" }
azalea-registry-macros = { path = "azalea-registry-macros" }
serde = { version = "1", optional = true, features = ["derive"] }
simdnbt = "0.10"

[features]
serde = ["azalea-registry-macros/serde", "dep:serde"]
default = ["serde"]
