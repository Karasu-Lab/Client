[package]
name = "pomme-singleplayer"
version = "0.1.0"
edition = "2024"
# Links SteelMC, which is AGPL-3.0-or-later, so this crate is too. GPLv3 section
# 13 permits the combination with the GPL-3.0-or-later client.
license = "AGPL-3.0-or-later"

[features]
default = ["server"]
# The integrated server behind singleplayer. Off, only terrain generation
# (`generated`) is built, which is what compiles for the web.
server = ["dep:steel-login", "dep:tokio", "dep:tokio-util"]

[dependencies]
steel-core = { path = "../third_party/SteelMC/steel-core" }
steel-login = { path = "../third_party/SteelMC/steel-login", optional = true }
steel-registry = { path = "../third_party/SteelMC/steel-registry" }
steel-utils = { path = "../third_party/SteelMC/steel-utils" }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
tracing = { workspace = true }

[dev-dependencies]
pomme-protocol = { path = "../pomme-protocol" }
